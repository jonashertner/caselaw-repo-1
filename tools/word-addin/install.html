<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCaseLaw Word Add-in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: #f7f7f8; color: #18181b; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; -webkit-font-smoothing: antialiased; }
    .page { max-width: 560px; width: 100%; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: #b91c24; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .brand { font-size: 18px; font-weight: 700; }
    .badge { display: inline-flex; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; background: #fef2f2; color: #b91c24; border: 1px solid #fecaca; margin-left: 8px; }
    .lang-bar { display: flex; gap: 8px; margin-bottom: 24px; }
    .lang-btn { padding: 4px 10px; font-family: inherit; font-size: 12px; font-weight: 600; border: 1px solid #e4e4e7; border-radius: 6px; background: #fff; color: #52525b; cursor: pointer; transition: all 0.15s; }
    .lang-btn:hover { border-color: #18181b; color: #18181b; }
    .lang-btn.active { background: #18181b; color: #fff; border-color: #18181b; }
    h1 { font-size: 26px; font-weight: 200; line-height: 1.3; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #52525b; line-height: 1.7; margin-bottom: 32px; }
    .download-btn { display: block; width: 100%; padding: 14px; background: #18181b; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; transition: opacity 0.15s; }
    .download-btn:hover { opacity: 0.88; }
    .tabs { display: flex; gap: 0; margin-top: 32px; border-bottom: 1px solid #e4e4e7; }
    .tab { padding: 10px 14px; font-family: inherit; font-size: 13px; font-weight: 500; border: none; background: none; color: #71717a; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
    .tab:hover { color: #18181b; }
    .tab.active { color: #18181b; border-bottom-color: #18181b; }
    .tab-content { display: none; padding-top: 20px; }
    .tab-content.active { display: block; }
    .step { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f4f4f5; }
    .step:last-of-type { border-bottom: none; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: #18181b; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .step-text { font-size: 14px; line-height: 1.6; }
    .step-text strong { font-weight: 600; }
    code { font-size: 11px; background: #f4f4f5; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; word-break: break-all; }
    .hint { font-size: 12px; color: #71717a; margin-top: 12px; line-height: 1.5; }
    .perm-box { margin-top: 16px; border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; }
    .perm-toggle { width: 100%; padding: 12px 16px; background: #fafafa; border: none; font-family: inherit; font-size: 13px; font-weight: 500; color: #52525b; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; }
    .perm-toggle:hover { background: #f4f4f5; }
    .perm-toggle .arrow { transition: transform 0.2s; }
    .perm-body { display: none; padding: 16px; font-size: 13px; line-height: 1.7; border-top: 1px solid #e4e4e7; }
    .perm-body.open { display: block; }
    .perm-option { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f4f4f5; }
    .perm-option:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .perm-label { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #71717a; margin-bottom: 8px; }
    .persist { display: inline-flex; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; background: #ecfdf5; color: #047857; margin-left: 4px; }
    .note { margin-top: 24px; padding: 14px 16px; background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; font-size: 13px; color: #52525b; line-height: 1.6; }
    .footer { margin-top: 32px; text-align: center; font-size: 12px; color: #a1a1aa; }
    .footer a { color: #18181b; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>

      },

        dl: 'Scarica il manifesto (file XML)',

        '<div class="tabs">'+
        '<button class="tab'+(tab==='win'?' active':'')+'" onclick="setTab(\'win\')">'+t.t1+' <span class="persist">'+t.p+'</span></button>'+
        '<button class="tab'+(tab==='mac'?' active':'')+'" onclick="setTab(\'mac\')">'+t.t2+'</button>'+
        '<button class="tab'+(tab==='online'?' active':'')+'" onclick="setTab(\'online\')">'+t.t3+'</button>'+

      if(tab==='online') h+=S(1,t.o[0])+S(2,t.o[1])+S(3,t.o[2])+S(4,t.o[3])+'<div class="hint">'+t.oh+'</div>';
      if(tab==='mac') {
        h+=S(1,t.m[0])+S(2,t.m[1])+S(3,t.m[2]);
        h+='<div class="hint">'+t.mreload+'</div>';
        h+='<div class="perm-box"><button class="perm-toggle" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.arrow\').textContent=b.classList.contains(\'open\')?\'\u25B2\':\'\u25BC\'">'+t.mperm_title+' <span class="arrow">\u25BC</span></button>';
        h+='<div class="perm-body">';
        h+='<div class="perm-option"><div class="perm-label">Option A</div>'+t.mperm_finder+'</div>';
        h+='<div class="perm-option"><div class="perm-label">Option B</div>'+t.mperm_term+'<br><code style="cursor:pointer" title="Click to copy" onclick="navigator.clipboard.writeText(this.textContent.trim());var b=this;b.style.background=\'#d1fae5\';setTimeout(function(){b.style.background=\'#f4f4f5\'},800)">'+t.mcode+'</code></div>';

        h+='</div></div>';

      document.getElementById('content').innerHTML=h; // eslint-disable-line -- all hardcoded strings
    }
