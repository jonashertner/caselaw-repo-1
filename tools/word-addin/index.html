<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCaseLaw</title>

  <!-- Office.js from CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo" aria-label="OpenCaseLaw">OCL</div>
      <span class="brand">OpenCaseLaw</span>
    </div>
    <div class="header-right">
      <select id="lang-select" class="lang-select" aria-label="Sprache">
        <option value="de" selected>DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="en">EN</option>
      </select>
      <button id="btn-settings" class="btn-icon" aria-label="Einstellungen" title="Einstellungen">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="10" cy="10" r="3" />
          <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.9 3.9l1.4 1.4M14.7 14.7l1.4 1.4M3.9 16.1l1.4-1.4M14.7 5.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main id="app">
    <!-- Views rendered here by app.js -->
  </main>

  <!-- Scripts (order matters) -->
  <script src="js/citation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/word-api.js"></script>
  <script src="js/verify.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
