# Serialise the post-build batch (re-enabled 2026-07-30).
#
# Same switch that ran 2026-05-04..05-16 for disk headroom (see the
# .disabled sibling). New rationale: measured on 07-29/30, MemoryHigh=32G
# removed the catastrophic page-cache eviction (worst search p95 48.8s ->
# 20.6s) but the 2-way parallel batch still keeps device IO saturated
# 12:00-17:00 UTC, holding search medians at 5-8s all afternoon. One heavy
# reader at a time roughly halves that pressure; the ~1.5h of extra wall
# (per the May run) lands in the low-traffic evening. Interim measure until
# the ETH build/serving split removes the contention entirely.
#
# Apply: cp to /etc/systemd/system/opencaselaw-publish.service.d/ and
# `systemctl daemon-reload` before the 03:30 UTC start.
[Service]
Environment=OCL_PARALLEL_POST_BUILD=0
