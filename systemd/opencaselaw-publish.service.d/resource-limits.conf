# Keep the nightly rebuild from degrading serving (applied 2026-07-29).
#
# Measured mechanism: the publish cgroup peaks at ~37.6G (RSS + the page
# cache it drags in while rewriting the 67GB output tree), evicting the
# serving workers' hot SQLite pages on a 61G box. Search p95 during the
# publish tail hit 104s vs ~3-7s off-window (search_traces 2026-07-29,
# hour-by-hour). The unit's CPUWeight=60/IOWeight=50 were not the binding
# resource — memory was.
#
# MemoryHigh throttles reclaim above the ceiling instead of OOM-killing
# (that would be MemoryMax, deliberately NOT set). Trade accepted: the
# rebuild may run somewhat longer; users stay fast. TimeoutStartSec is
# 86400 (timeout.conf), so wall-clock headroom is ample.
#
# Apply: copy to /etc/systemd/system/opencaselaw-publish.service.d/ on the
# VPS, then `systemctl daemon-reload`. Verify with:
#   systemctl show opencaselaw-publish.service -p CPUWeight,IOWeight,MemoryHigh
[Service]
CPUWeight=20
IOWeight=20
MemoryHigh=32G
