# bger.ch stopped sending its intermediate cert 2026-08-24 (see the identical
# drop-in on opencaselaw-scrape.service / opencaselaw-late-scrapers.service).
# Without this every requests fetch of bger.ch fails TLS verification and the
# poller reports "0 new decisions" despite detecting the batch. Remove all
# three drop-ins together when upstream fixes its chain.
[Service]
Environment=REQUESTS_CA_BUNDLE=/opt/caselaw/certs/ca-bundle.pem
