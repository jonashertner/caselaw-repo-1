# TimeoutStartSec raise (2026-08-23). The service default (6h) killed the
# one-time DOUBLE extractor-version bootstrap on 2026-08-22 at exactly
# 02:01:14 — graph reseed done (3.4h), structure reseed terminated mid-run.
# Normal incremental nights run ~90min; a single-twin full bootstrap is
# ~2-4h; the pathological case is both twins at once (~7h), which recurs
# whenever BOTH extractors change in one deploy. 10h clears that with
# margin while still catching a genuinely hung run before the 20:00 slot
# collides with the next day's.
[Service]
TimeoutStartSec=10h
