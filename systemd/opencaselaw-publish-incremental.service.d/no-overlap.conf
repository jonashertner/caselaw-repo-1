# Do not start the incremental publish while a FULL rebuild is still running
# (added 2026-08-25).
#
# In the deployed shadow phase the two builders do NOT write the same
# artefacts (--skip-quick-publish, no --in-place). They would after the
# cutover, and the ExecCondition is what makes that flip safe.
#
# opencaselaw-publish.timer fires
# 03:30 UTC and the run is nominally ~13-14h, but it has been drifting: the
# 2026-08-25 run was still in step 2g (decision_structure) at 17:30 and was
# projected to exit ~19:40 — 21 minutes before this unit's 20:01 slot. Until
# now the only guard was ConditionPathExists=!/tmp/opencaselaw-publish.lock
# on the unit itself (production-proven: it skipped a real overrun on Aug 18
# at 20:01:58). That guard is CORRECT and must stay — this ExecCondition
# additionally covers the case where the lock file is absent or stale, since
# scripts/incremental_nightly.py holds no flock or pidfile of its own.
#
# ExecCondition (not Conflicts=, which would KILL the running full rebuild,
# and not ExecStartPre, which would mark the unit failed): a non-zero exit
# skips the run cleanly and leaves no failure state to clear.
#
# Trade-off accepted: on a night the full build overruns, the shadow DBs are
# not refreshed, so the 00:44 drift check compares a day-old shadow against
# fresh live and its verdict is not meaningful. That is strictly better than
# two builders writing the same files at once. The skip is greppable:
#   journalctl -u opencaselaw-publish-incremental.service | grep SKIPPED
#
# NOT guarded in the reverse direction on purpose: an ExecCondition on
# opencaselaw-publish.service could skip the nightly full rebuild, which is
# a worse failure than the overlap it would prevent.
[Unit]
After=opencaselaw-publish.service

[Service]
ExecCondition=/bin/bash -c 'systemctl show --value -p ActiveState opencaselaw-publish.service | grep -qxE "active|activating|reloading|deactivating" && { echo "SKIPPED: full rebuild still in flight, not starting incremental publish"; exit 1; }; exit 0'
