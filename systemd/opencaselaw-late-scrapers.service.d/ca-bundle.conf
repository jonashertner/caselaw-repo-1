# Supply the CA chain link www.bger.ch stopped sending (2026-08-25).
#
# On 2026-08-24 the Bundesgericht renewed its certificate (notBefore
# Aug 24 00:00 GMT, SANs: www.bger.ch, bger.ch, tribunal-federal.ch,
# tribunale-federale.ch) and the server now presents a LEAF-ONLY chain —
# the DigiCert Global G2 TLS RSA SHA256 2020 CA1 intermediate is no
# longer sent. macOS/Windows clients chase the leaf AIA extension and
# still succeed; OpenSSL does not chase AIA, so every requests-based
# scraper died with CERTIFICATE_VERIFY_FAILED from 01:02:13 UTC on
# 2026-08-25 — 46 discovery failures, both the 01:01 and 10:20 runs
# (the alert text "portal unreachable" is misleading: TCP 443 was open).
#
# Verified on the VPS before shipping:
#   requests -> www.bger.ch AZA search, certifi default : SSLError
#   requests -> same, REQUESTS_CA_BUNDLE=ca-bundle.pem  : HTTP 200, 22,904 b
#   both direct and through socks5h://127.0.0.1:1080
#
# The bundle is certifi + intermediates that ALREADY verify against
# certifi, so no new trust anchor is introduced (openssl verify -CAfile
# certifi inter.pem => OK, chains to DigiCert Global Root G2). It is
# rebuilt on every start so a certifi upgrade cannot revert the fix;
# ExecStartPre is "-" prefixed because a build failure leaves the last
# good bundle in place, and failing the scrape would be worse.
#
# REMOVE THIS once bger.ch serves a complete chain again. Check with:
#   openssl s_client -connect www.bger.ch:443 -servername www.bger.ch \
#     </dev/null 2>/dev/null | grep -c "^ 1 s:"    # 1 = fixed upstream
[Service]
ExecStartPre=-/opt/caselaw/certs/build-ca-bundle.sh
Environment=REQUESTS_CA_BUNDLE=/opt/caselaw/certs/ca-bundle.pem
Environment=SSL_CERT_FILE=/opt/caselaw/certs/ca-bundle.pem
