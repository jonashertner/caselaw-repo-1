# Bulk-export notice for a distributed harvesting fleet
# DRAFTED 2026-08-24 — NOT APPLIED (no VPS access in the authoring session).
#
# WHY
# ---
# Ten Google Cloud IPs sharing ONE forged user agent
# ("...Chrome/120.0.0.0 Safari/537.36" — Chrome 120 is >1 year stale; no
# real browser fleet sends it) pulled ~2.6M requests in four days:
#   2026-08-21  1,299,445
#   2026-08-22    915,121
#   2026-08-23    162,928
#   2026-08-24   ~207,218 and rising again
# Almost all /api/decisions/<id>/export.bib — they are assembling a citation
# database (BibTeX is the academic format), plus /laws/. Courts led by
# ge / bvger / ti / vd / bger — heavy FR+IT cantonal law. rDNS is generic
# (*.bc.googleusercontent.com): unidentifiable by design.
#
# THE KEY FINDING — WHY A RATE LIMIT CANNOT FIX THIS
# ---------------------------------------------------
# The export location ALREADY has `limit_req zone=mcp_expensive` at
# **5 r/s per IP** (line ~190 of sites-available/mcp-server), and robots.txt
# has disallowed these paths since 2026-06-25.
#
#   1,299,445 req/day ÷ 10 IPs ÷ 86,400 s = **~1.5 r/s per IP**
#
# They run at 30 % of the existing limit and ignore robots.txt. A tighter
# per-IP rate does NOT work: to catch 1.5 r/s you must go below it, which
# starts hurting interactive users, and they can simply add IPs. Per-IP
# rate limiting is structurally the wrong instrument against a distributed
# fleet. An earlier draft of this file proposed a 2 r/s export zone — that
# would have changed NOTHING. Do not reintroduce it.
#
# WHAT ACTUALLY WORKS
# -------------------
# 1. NOW — match the forged UA and answer 429 with a notice. Precise, zero
#    infrastructure, and the response body is the only channel that reaches
#    an anonymous operator. They can change the string; that is fine, it
#    costs us one line and buys the conversation we actually want.
# 2. DURABLE — a per-IP-per-DAY budget, which is the right shape for this
#    (a human exports a handful a day; this fleet did 129,944 per IP per
#    day). nginx's limit_req cannot express a daily budget, but
#    `web_api/ocl_quota.py` ALREADY DOES exactly this for LLM endpoints
#    (quota_calls keyed on ip+day+endpoint, with api_keys multipliers for
#    identified users). Extending it to cover export paths is the real fix
#    and reuses the alerting + higher-limits-for-known-users machinery.
#    Filed as follow-up, not implemented here.
#
# NOT AFFECTED, deliberately: Googlebot, ClaudeBot and DataForSeoBot crawl
# /entscheid/ — a different location — and are untouched. Do NOT block
# Google Cloud ranges wholesale: legitimate MCP users appear on 34.34.235.x
# and are not this fleet.
#
# COLLATERAL RISK, stated plainly: any real client presenting
# Chrome/120.0.0.0 gets 429 on EXPORT PATHS ONLY, and receives a notice
# explaining why with a contact address. Chrome 120 shipped Nov 2023.
# Acceptable; revisit if anyone writes in.


# ─── PART 1 — http context: /etc/nginx/conf.d/ocl-bulk-export.conf ───────

# Kept as a map (not an if-chain) so a future signature is one more line.
map $http_user_agent $ocl_known_harvester {
    default                 0;
    "~Chrome/120\.0\.0\.0"  1;
}


# ─── PART 2 — merge into the EXISTING export location ────────────────────
# sites-available/mcp-server, `location ~ ^/api/decisions/[^/]+/export {`
# (~line 190). Do NOT add a second location — nginx regex locations are
# first-match-wins and a duplicate would never be reached.
# Insert immediately AFTER the OPTIONS/CORS block and BEFORE
# `limit_req zone=mcp_expensive`:
#
#         # Distributed harvesting fleet, 2026-08-24. See
#         # deploy/nginx/bulk-export-throttle.conf for the evidence.
#         if ($ocl_known_harvester) { return 429; }
#
# `if` with `return` is one of the documented-safe uses of `if` in
# location context (the "if is evil" caveat concerns other directives).


# ─── PART 3 — the notice, same server block ──────────────────────────────
# `internal` so it cannot be fetched directly; `always` on add_header
# because nginx drops headers on 4xx without it.
#
#     error_page 429 /_bulk-access.txt;
#     location = /_bulk-access.txt {
#         internal;
#         root /opt/caselaw/static-notices;
#         try_files /bulk-access.txt =404;
#         default_type text/plain;
#         charset utf-8;
#         add_header Link '<https://huggingface.co/datasets/voilaj/swiss-caselaw>; rel="alternate"; title="bulk corpus"' always;
#         add_header Retry-After 3600 always;
#         add_header X-OpenCaseLaw-Contact "team@jonashertner.com" always;
#     }
#
# NOTE: this also becomes the body for the EXISTING mcp_expensive 429s,
# which is an improvement — today they get nginx's default page.


# ─── APPLY ───────────────────────────────────────────────────────────────
#  1. mkdir -p /opt/caselaw/static-notices
#     scp deploy/nginx/bulk-access.txt root@VPS:/opt/caselaw/static-notices/
#  2. Install PART 1 as /etc/nginx/conf.d/ocl-bulk-export.conf
#  3. Apply PARTS 2 and 3 to sites-available/mcp-server (sites-enabled is a
#     symlink again as of 2026-08-24, so edit sites-available).
#  4. nginx -t          <-- MANDATORY. This file has never been parsed.
