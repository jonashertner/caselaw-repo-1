# Per-IP export budget — installed 2026-08-24.
#
# WHAT HAPPENED
# -------------
# Ten Google Cloud IPs sharing one forged Chrome/120 user agent pulled
# ~2.6M requests in four days (peak 1,299,445 on 08-21), almost all
# /api/decisions/<id>/export.bib — assembling a citation database.
# They averaged ~1.5 r/s per IP against the existing 5 r/s per-IP limit,
# so it never fired. Per-second limits do not catch a fleet that paces
# itself below them and adds IPs at will.
#
# WHY THIS METERS EVERYONE AND NOT JUST THAT USER AGENT
# -----------------------------------------------------
# The first version keyed on the forged UA. Measured against real traffic,
# that was wrong: on 2026-08-24, 230 IPs OTHER than the fleet sent the same
# UA and 219 of their requests hit export paths, at 1-2 requests each.
# Some are probably low-and-slow scrapers, but an ordinary person clicking
# Export once is indistinguishable from them by user agent — and a public
# research project must not answer 429 to someone who wanted one file.
# Keying on a browser version is also arbitrary: Chrome/120 metered,
# Chrome/131 not, for identical behaviour.
#
# So: one rule for everyone, and VOLUME decides. This also covers the next
# harvester, who will not reuse this one's user agent.
#
# CALIBRATION
# -----------
#   burst 30, nodelay  -> 30 exports served instantly, no queueing
#   rate  10r/m        -> then one per 6 s, refilling continuously
#
#   Ordinary user  : exports 1-30 files and never notices. A researcher
#                    assembling a 50-item bibliography waits ~2 min total.
#   Harvester      : 14,430/IP/day instead of 129,944 — an ~89 % cut, and
#                    ~9x slower, which is the point: it makes scraping the
#                    slow path and the mirror the fast one.
#
# Refused requests receive /opt/caselaw/static-notices/bulk-access.txt,
# which points at the CC0 HuggingFace mirror and invites commercial and
# high-volume users to negotiate a custom arrangement by email rather than
# be throttled.
#
# NOT affected: /entscheid/, /laws/, /api/decisions/<id> (the JSON record),
# search, or the MCP surface. This zone applies ONLY to the export
# renderers, which are the expensive, crawler-magnet paths.
limit_req_zone $binary_remote_addr zone=ocl_export:10m rate=10r/m;
