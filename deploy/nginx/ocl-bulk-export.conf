# Known distributed export-harvesting fleet — installed 2026-08-24.
# Ten Google Cloud IPs sharing ONE forged user agent pulled ~2.6M requests
# in four days (peak 1,299,445 on 08-21), almost all export.bib.
# They averaged ~1.5 r/s per IP against a 5 r/s per-IP limit, so the
# existing rate limit never fired — see deploy/nginx/bulk-export-throttle.conf.
# Adding a future signature is one more line in this map.
map $http_user_agent $ocl_known_harvester {
    default                0;
    "~Chrome/120\.0\.0\.0" 1;
}
