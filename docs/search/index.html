<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Swiss case law — OpenCaseLaw</title>
<meta name="description" content="Free full-text search over every published Swiss court decision, in German, French and Italian. No account, no API key.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="canonical" href="https://opencaselaw.ch/search/">
<link rel="alternate" hreflang="de" href="https://opencaselaw.ch/search/?lang=de">
<link rel="alternate" hreflang="fr" href="https://opencaselaw.ch/search/?lang=fr">
<link rel="alternate" hreflang="it" href="https://opencaselaw.ch/search/?lang=it">
<link rel="alternate" hreflang="rm" href="https://opencaselaw.ch/search/?lang=rm">
<link rel="alternate" hreflang="en" href="https://opencaselaw.ch/search/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://opencaselaw.ch/search/">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mcp.opencaselaw.ch">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<link rel="stylesheet" href="/static/css/site.css?v=2">
<style>
  .s-form{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin:36px 0 0}
  .s-input{flex:1 1 320px;min-width:240px;padding:13px 16px;font:inherit;font-size:16px;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--t1)}
  .s-input:focus{outline:2px solid var(--red);outline-offset:1px}
  .examples{margin:18px 0 0;font-size:13.5px;color:var(--t2);line-height:2}
  .examples .lbl{color:var(--t3);font-family:var(--f-mono);font-size:12px;margin-right:6px}
  .examples a{color:var(--t2);text-decoration:none;margin-right:16px;border-bottom:1px dotted var(--t3);padding-bottom:1px}
  .examples a:hover{color:var(--t1);border-color:var(--t1)}
  .s-filters{display:flex;gap:7px;flex-wrap:wrap;margin:28px 0 22px}
  .s-filters button{padding:7px 14px;font:inherit;font-size:13px;background:var(--paper);color:var(--t2);
    border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
  .s-filters button:hover{color:var(--t1);border-color:var(--t3)}
  .s-filters button.active{background:var(--t1);color:var(--paper);border-color:var(--t1)}
  .s-meta{font-family:var(--f-mono);font-size:12.5px;color:var(--t3);margin:0 0 20px}
  .r-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  .result{border:1px solid var(--line);border-radius:12px;padding:20px 22px;transition:border-color .16s var(--ease),transform .16s,box-shadow .16s;background:var(--paper)}
  .result:hover{border-color:var(--t3);transform:translateY(-1px);box-shadow:0 10px 26px var(--line-2)}
  .r-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
  .r-cite{font-family:var(--f-mono);font-size:12.5px;color:var(--red);letter-spacing:-.01em}
  .r-cite a{color:inherit;text-decoration:none}
  .r-cite a:hover{text-decoration:underline;text-underline-offset:2px}
  .r-lang{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);flex:0 0 auto}
  .r-title{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:0 0 8px}
  .r-title a{text-decoration:none;color:var(--t1)}
  .r-title a:hover{text-decoration:underline;text-underline-offset:2px}
  .r-regeste{font-size:14px;color:var(--t2);line-height:1.55;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .r-meta{margin-top:12px;font-family:var(--f-mono);font-size:11.5px;color:var(--t3);display:flex;gap:14px;flex-wrap:wrap}
  .empty,.error{padding:56px 16px;text-align:center;color:var(--t2)}
  .empty strong{color:var(--t1);display:block;margin-bottom:8px;font-size:18px;font-weight:600}
  .error{color:var(--red)}
  .skeleton{background:var(--paper-2);border:1px solid var(--line-2);border-radius:12px;height:96px;margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
  @media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
  .pager{display:flex;gap:12px;justify-content:center;margin-top:40px;font-size:14px;align-items:baseline}
  .pager a,.pager .disabled{padding:9px 15px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--t1);font-family:var(--f-mono);font-size:13px}
  .pager .disabled{color:var(--t3);cursor:not-allowed}
  .pager a:hover{border-color:var(--t3)}
  .pager .pager-info{color:var(--t3);padding:9px 0;font-family:var(--f-mono);font-size:12.5px}
</style>
</head>
<body>
<a href="#main" class="skip" data-t="skip">Skip to content</a>
<div data-nav></div>

<main id="main">
  <section class="page-head first">
    <div class="wrap" style="max-width:760px;margin:0 auto">
      <p class="page-kicker"><b data-t="s_kick">Search</b></p>
      <h1 class="page-h1" data-t="s_h1">Search the open Swiss corpus</h1>
      <p class="page-lead" data-t="s_lede">Free full-text search over every published Swiss court decision, in German, French and Italian. No account, no API key.</p>
    </div>
  </section>

  <section class="wrap" style="max-width:760px;margin:0 auto;padding-bottom:clamp(64px,9vw,112px)">
    <form class="s-form" id="form" role="search" aria-label="Search Swiss case law">
      <input class="s-input" type="search" id="q" name="q" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search query">
      <button type="submit" class="btn btn-primary" data-t="s_submit">Search</button>
    </form>
    <p class="examples">
      <span class="lbl" data-t="s_try">Try:</span>
      <a href="?q=Mietrecht+K%C3%BCndigung+Form">Mietrecht Kündigung Form</a>
      <a href="?q=Art.+41+OR+Schadenersatz">Art. 41 OR Schadenersatz</a>
      <a href="?q=BGE+140+III+86">BGE 140 III 86</a>
      <a href="?q=6B_1234%2F2025">6B_1234/2025</a>
      <a href="?q=protection+des+donn%C3%A9es&amp;lang=fr">protection des données</a>
    </p>
    <div class="s-filters" id="filters" hidden>
      <button data-filter="" class="active" type="button" data-t="s_allLangs">All languages</button>
      <button data-filter="de" type="button">DE</button>
      <button data-filter="fr" type="button">FR</button>
      <button data-filter="it" type="button">IT</button>
    </div>
    <div class="s-meta" id="meta" hidden></div>
    <ul class="r-list" id="results" aria-live="polite"></ul>
    <div class="pager" id="pager" hidden></div>
  </section>
</main>

<div data-foot></div>
<script src="/static/js/site.js?v=1"></script>
<script>
OCL.init({
  active:'search',
  i18n:{
    de:{s_kick:'Suche',s_h1:'Den offenen Schweizer Korpus durchsuchen',s_lede:'Volltextsuche über jeden publizierten Schweizer Gerichtsentscheid, auf Deutsch, Französisch und Italienisch. Ohne Konto, ohne API-Key.',
      s_submit:'Suchen',s_try:'Versuchen Sie:',s_allLangs:'Alle Sprachen',s_ph:'z. B. "Art. 41 OR Schadenersatz" · 6B_1234/2025 · Mietrecht Kündigung',
      m_searching:'Suche nach "{q}" …',m_matching:'{total} passende Entscheide · {ms} ms',
      r_no:'Keine Treffer für "{q}"',r_noHint:'Versuchen Sie allgemeinere Begriffe, lassen Sie Akzente weg oder prüfen Sie das Format der Aktennummer (z. B. 6B_1234/2025).',r_untitled:'(Entscheid ohne Titel)',
      p_prev:'← Zurück',p_next:'Weiter →',p_showing:'Zeige {from}–{to} von {total}',
      e_stale:'Die API hat den ungefilterten Korpus zurückgegeben ({total} Zeilen). Meist ist das Seiten-JS veraltet — laden Sie hart neu (⌘⇧R / Strg+Umschalt+R).',e_failed:'Suche fehlgeschlagen: {msg}. Bitte erneut versuchen.'},
    fr:{s_kick:'Recherche',s_h1:'Rechercher dans le corpus suisse ouvert',s_lede:'Recherche plein texte sur chaque décision publiée des tribunaux suisses, en allemand, français et italien. Sans compte, sans clé API.',
      s_submit:'Rechercher',s_try:'Essayez :',s_allLangs:'Toutes les langues',s_ph:'p. ex. "Art. 41 OR Schadenersatz" · 6B_1234/2025 · Mietrecht Kündigung',
      m_searching:'Recherche de "{q}" …',m_matching:'{total} décisions correspondantes · {ms} ms',
      r_no:'Aucun résultat pour "{q}"',r_noHint:'Essayez des termes plus généraux, supprimez les diacritiques ou vérifiez le format du numéro de dossier (p. ex. 6B_1234/2025).',r_untitled:'(décision sans titre)',
      p_prev:'← Précédent',p_next:'Suivant →',p_showing:'Affichage de {from}–{to} sur {total}',
      e_stale:'L\'API a renvoyé le corpus non filtré ({total} lignes). Le JS de la page est probablement obsolète — actualisez de force (⌘⇧R / Ctrl+Maj+R).',e_failed:'Échec de la recherche : {msg}. Réessayez.'},
    it:{s_kick:'Ricerca',s_h1:'Cerca nel corpus svizzero aperto',s_lede:'Ricerca a testo pieno su ogni decisione pubblicata dei tribunali svizzeri, in tedesco, francese e italiano. Senza account, senza chiave API.',
      s_submit:'Cerca',s_try:'Provate:',s_allLangs:'Tutte le lingue',s_ph:'p. es. "Art. 41 OR Schadenersatz" · 6B_1234/2025 · Mietrecht Kündigung',
      m_searching:'Ricerca di "{q}" …',m_matching:'{total} decisioni corrispondenti · {ms} ms',
      r_no:'Nessun risultato per "{q}"',r_noHint:'Provate termini più generici, eliminate i segni diacritici o verificate il formato del numero di pratica (p. es. 6B_1234/2025).',r_untitled:'(decisione senza titolo)',
      p_prev:'← Precedente',p_next:'Successivo →',p_showing:'Risultati {from}–{to} di {total}',
      e_stale:'L\'API ha restituito il corpus non filtrato ({total} righe). Di solito il JS della pagina è obsoleto — ricaricate forzatamente (⌘⇧R / Ctrl+Maiusc+R).',e_failed:'Ricerca non riuscita: {msg}. Riprovate.'},
    rm:{s_kick:'Tschertga',s_h1:'Tschertgar en il corpus svizzer avert',s_lede:'Tschertga da text cumplet sur mintga decisiun publitgada dals tribunals svizzers, en tudestg, franzos e talian. Nagin conto, nagina clav API.',
      s_submit:'Tschertgar',s_try:'Empruvai:',s_allLangs:'Tut las linguas',s_ph:'p. ex. "Art. 41 OR Schadenersatz" · 6B_1234/2025 · Mietrecht Kündigung',
      m_searching:'Tschertga da "{q}" …',m_matching:'{total} decisiuns correspundentas · {ms} ms',
      r_no:'Nagins resultats per "{q}"',r_noHint:'Empruvai noziuns pli generalas, laschai davent ils accents u controllai il format dal numer dal dossier (p. ex. 6B_1234/2025).',r_untitled:'(decisiun senza titel)',
      p_prev:'← Enavos',p_next:'Enavant →',p_showing:'Mussar {from}–{to} da {total}',
      e_stale:'L\'API ha returnà il corpus betg filtrà ({total} lingias). Per ordinari è il JS da la pagina antiquà — rechargiai cun forza (⌘⇧R / Ctrl+Maiusc+R).',e_failed:'La tschertga è fallida: {msg}. Empruvai anc ina giada.'},
    en:{s_kick:'Search',s_h1:'Search the open Swiss corpus',s_lede:'Free full-text search over every published Swiss court decision, in German, French and Italian. No account, no API key.',
      s_submit:'Search',s_try:'Try:',s_allLangs:'All languages',s_ph:'e.g. "Art. 41 OR Schadenersatz" · 6B_1234/2025 · Mietrecht Kündigung',
      m_searching:'Searching for "{q}"…',m_matching:'{total} matching decisions · {ms} ms',
      r_no:'No matches for "{q}"',r_noHint:'Try broader terms, drop diacritics, or check the docket-number format (e.g. 6B_1234/2025).',r_untitled:'(untitled decision)',
      p_prev:'← Previous',p_next:'Next →',p_showing:'Showing {from}–{to} of {total}',
      e_stale:'The API returned the unfiltered corpus ({total} rows). This usually means the page JS is stale — hard-refresh (⌘⇧R / Ctrl+Shift+R).',e_failed:'Search failed: {msg}. Try again.'}
  },
  onReady:function(O){
    'use strict';
    function T(k,v){var s=O.t(k); if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]); return s;}
    document.getElementById('q').placeholder=O.t('s_ph');
    var API='https://mcp.opencaselaw.ch/api/decisions', PAGE_SIZE=20;
    var $=function(s){return document.querySelector(s);};
    function params(){return new URLSearchParams(location.search);}
    function unesc(s){return s?String(s).replace(/\\x([0-9a-fA-F]{2})/g,function(_,h){return String.fromCharCode(parseInt(h,16));}):s;}
    function fmtDate(iso){if(!iso||!/^\d{4}-\d{2}-\d{2}/.test(iso))return'';var p=iso.split('T')[0].split('-');return p[2]+'.'+p[1]+'.'+p[0];}
    function pickCite(r,lang){var k=(lang==='fr'||lang==='it')?'citation_string_'+lang:'citation_string_de';return r[k]||r.citation_string_de||r.docket_number||r.decision_id;}
    function el(tag,props,kids){var n=document.createElement(tag);if(props)for(var k in props){if(k==='class')n.className=props[k];else if(k==='text')n.textContent=props[k];else if(k==='href')n.setAttribute('href',props[k]);else if(k.indexOf('aria-')===0||k==='role'||k==='rel'||k==='target')n.setAttribute(k,props[k]);else n[k]=props[k];}if(kids)kids.forEach(function(c){if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
    function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
    function safeUrl(u){try{var p=new URL(u,location.href);return (p.protocol==='http:'||p.protocol==='https:')?p.href:'#';}catch(e){return '#';}}
    function buildLi(r){
      var title=unesc(r.title)||T('r_untitled'); var cite=pickCite(r,r.language);
      var url=safeUrl(r.canonical_url||('https://mcp.opencaselaw.ch/entscheid/'+encodeURIComponent(r.decision_id)));
      var regeste=unesc(r.regeste)||''; var date=fmtDate(r.decision_date);
      var head=el('div',{class:'r-head'},[el('span',{class:'r-cite'},[el('a',{href:url,target:'_blank',rel:'noopener',text:cite})]),el('span',{class:'r-lang',text:(r.language||'').toUpperCase()})]);
      var titleH2=el('h2',{class:'r-title'},[el('a',{href:url,target:'_blank',rel:'noopener',text:title})]);
      var meta=el('div',{class:'r-meta'},[r.court?el('span',{text:r.court}):null,date?el('span',{text:date}):null,r.canton?el('span',{text:r.canton}):null]);
      return el('li',{class:'result'},[head,titleH2,regeste?el('p',{class:'r-regeste',text:regeste}):null,meta]);
    }
    function renderResults(data,q){var list=$('#results');clear(list);var rs=data.results||[];
      if(!rs.length){list.appendChild(el('li',{class:'empty'},[el('strong',{text:T('r_no',{q:q})}),T('r_noHint')]));return;}
      rs.forEach(function(r){list.appendChild(buildLi(r));});}
    function renderPager(total,offset,q,lang){var pager=$('#pager');clear(pager);if(total<=PAGE_SIZE){pager.hidden=true;return;}pager.hidden=false;
      var prev=Math.max(0,offset-PAGE_SIZE),next=offset+PAGE_SIZE,hasPrev=offset>0,hasNext=next<total;
      var url=function(off){var p=new URLSearchParams({q:q});if(lang)p.set('lang',lang);if(off)p.set('offset',off);return '?'+p;};
      pager.appendChild(hasPrev?el('a',{href:url(prev),text:T('p_prev')}):el('span',{class:'disabled',text:T('p_prev')}));
      pager.appendChild(el('span',{class:'pager-info',text:T('p_showing',{from:offset+1,to:Math.min(offset+PAGE_SIZE,total),total:O.fmt(total)})}));
      pager.appendChild(hasNext?el('a',{href:url(next),text:T('p_next')}):el('span',{class:'disabled',text:T('p_next')}));}
    function setMeta(txt){var m=$('#meta');m.hidden=false;m.textContent=txt;}
    function skeleton(){var list=$('#results');clear(list);for(var i=0;i<6;i++)list.appendChild(el('li',{class:'skeleton','aria-hidden':'true'}));}
    function runSearch(q,lang,offset){
      if(!q){clear($('#results'));$('#meta').hidden=true;$('#pager').hidden=true;$('#filters').hidden=true;return;}
      $('#filters').hidden=false;skeleton();setMeta(T('m_searching',{q:q}));
      var url=new URL(API);url.searchParams.set('query',q);url.searchParams.set('limit',String(PAGE_SIZE));
      if(offset)url.searchParams.set('offset',String(offset));if(lang)url.searchParams.set('language',lang);
      var t0=performance.now();
      fetch(url,{cache:'no-store',headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();}).then(function(data){
        var ms=Math.round(performance.now()-t0);var total=(data.total!=null)?data.total:(data.results||[]).length;
        if(total>=500000&&q.length>0){var list=$('#results');clear(list);list.appendChild(el('li',{class:'error',text:T('e_stale',{total:O.fmt(total)})}));$('#meta').hidden=true;$('#pager').hidden=true;return;}
        setMeta(T('m_matching',{total:O.fmt(total),ms:ms}));renderResults(data,q);renderPager(total,offset||0,q,lang);
      }).catch(function(e){var list=$('#results');clear(list);list.appendChild(el('li',{class:'error',text:T('e_failed',{msg:e.message})}));$('#meta').hidden=true;$('#pager').hidden=true;});
    }
    function setLangBtns(lang){document.querySelectorAll('#filters button').forEach(function(b){b.classList.toggle('active',(b.dataset.filter||'')===(lang||''));});}
    function init(){var p=params();var q=p.get('q')||'';var lang=p.get('lang')||'';var offset=parseInt(p.get('offset')||'0',10)||0;$('#q').value=q;setLangBtns(lang);if(q)runSearch(q,lang,offset);}
    $('#form').addEventListener('submit',function(e){e.preventDefault();var q=$('#q').value.trim();var p=new URLSearchParams();if(q)p.set('q',q);history.pushState({q:q},'',q?'?'+p:location.pathname);runSearch(q,'',0);setLangBtns('');});
    document.querySelectorAll('#filters button').forEach(function(btn){btn.addEventListener('click',function(){var lang=btn.dataset.filter||'';var q=$('#q').value.trim();var p=new URLSearchParams({q:q});if(lang)p.set('lang',lang);history.pushState({q:q,lang:lang},'','?'+p);runSearch(q,lang,0);setLangBtns(lang);});});
    window.addEventListener('popstate',function(){init();});
    init();
  }
});
</script>
</body>
</html>
