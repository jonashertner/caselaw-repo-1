name: Feature or tool request
description: Something the corpus or the API should be able to do
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do
      description: The research or engineering task, not the proposed solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you work around it today
  - type: dropdown
    id: audience
    attributes:
      label: Who is this for
      options: [Legal practitioner, AI/MCP developer, Researcher, Other]
