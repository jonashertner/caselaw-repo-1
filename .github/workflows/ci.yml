name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio openai anthropic google-genai

      - name: Schema consistency tests
        run: python test_schema.py

      - name: Parsing tests
        run: python test_parsing.py

      - name: Import checks
        run: |
          python -c "from db_schema import SCHEMA_SQL, INSERT_COLUMNS, INSERT_SQL"
          python -c "from export_parquet import DECISION_SCHEMA, normalize_row"
          python -c "from models import Decision, make_decision_id, parse_date"
          python -c "from scrapers import get_registry; r = get_registry(); print(f'{len(r)} scrapers')"
          python -c "from quality_report import generate_quality_report, check_gates"

      - name: Unit tests (offline)
        run: |
          pytest -q \
            --ignore=test_bger_live.py \
            --ignore=test_federal_live.py \
            --ignore=test_build_vectors.py \
            --ignore=test_appeal_chain.py \
            --ignore=scripts/

      - name: Quality-control package tests
        run: pytest tests/qc/ -q

      - name: Quality-control check discovery
        run: python -m quality.cli list

      - name: Wheel build + content verification
        run: |
          # `--no-isolation` reuses the runner's Python env, which is fast
          # but means setuptools + wheel must be present (otherwise:
          # "Backend 'setuptools.build_meta' is not available").
          pip install --quiet build setuptools wheel
          python -m build --wheel --no-isolation
          python - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile('dist/swiss_caselaw_scrapers-0.1.0-py3-none-any.whl')
          required = ('quality/', 'web_api/', 'study/', 'scrapers/', 'search_stack/', 'mcp_server.py')
          missing = [r for r in required if not any(n.startswith(r) or n == r for n in z.namelist())]
          if missing:
              print('FAIL: wheel missing', missing)
              sys.exit(1)
          print('OK: wheel ships', len(required), 'required modules')
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: web_ui exists?
        id: web
        run: |
          if [ -f web_ui/package.json ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.web.outputs.build == 'true'
        with:
          node-version: '20'
      - name: web_ui build
        if: steps.web.outputs.build == 'true'
        working-directory: web_ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Tectonic
        # Tectonic is a hermetic LaTeX engine; one-binary install, fetches
        # packages on demand. Catches regressions like the underscore-package
        # / hyperref clash that broke the v3 paper compile in 2026-05.
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
      - name: Compile docs/paper/v3/paper.tex
        working-directory: docs/paper/v3
        run: tectonic --keep-logs paper.tex
