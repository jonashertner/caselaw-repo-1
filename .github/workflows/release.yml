name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.6.0" "twine==7.0.0"
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("swiss_caselaw_scrapers-*.whl"))
          sdists = list(dist.glob("swiss_caselaw_scrapers-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist; got {wheels=} {sdists=}")

          required = ("scrapers/", "search_stack/", "quality/", "web_api/", "study/", "mcp_server.py")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              missing = [item for item in required if not any(name == item or name.startswith(item) for name in names)]
              if missing:
                  raise SystemExit(f"wheel is missing required content: {missing}")

          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              forbidden = ("/.env", "/credentials", "/secret", ".pem", ".key")
              exposed = [name for name in names if any(marker in name.lower() for marker in forbidden)]
              if exposed:
                  raise SystemExit(f"sdist contains sensitive-looking paths: {exposed}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/swiss-caselaw-scrapers
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
