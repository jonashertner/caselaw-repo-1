name: Publish Python package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          PY

      - name: Run offline release tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt \
            "pytest==9.0.3" "pytest-asyncio==1.3.0" \
            "openai>=1.40" "anthropic>=0.40" "google-genai>=0.3"
          pytest -q \
            --ignore=test_bger_live.py \
            --ignore=test_federal_live.py \
            --ignore=test_build_vectors.py \
            --ignore=test_appeal_chain.py \
            --ignore=scripts/

      - name: Build and validate distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.6.0" "twine==7.0.0"
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("swiss_caselaw_scrapers-*.whl"))
          sdists = list(dist.glob("swiss_caselaw_scrapers-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist; got {wheels=} {sdists=}")

          required = ("scrapers/", "search_stack/", "quality/", "web_api/", "study/", "mcp_server.py")
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              missing = [item for item in required if not any(name == item or name.startswith(item) for name in names)]
              if missing:
                  raise SystemExit(f"wheel is missing required content: {missing}")

          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              forbidden = ("/.env", "/credentials", "/secret", ".pem", ".key")
              exposed = [name for name in names if any(marker in name.lower() for marker in forbidden)]
              if exposed:
                  raise SystemExit(f"sdist contains sensitive-looking paths: {exposed}")
          PY

      - name: Smoke-test the built API extra
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import venv

          root = pathlib.Path("/tmp/swiss-caselaw-release-smoke")
          venv.EnvBuilder(with_pip=True).create(root)
          python = root / "bin" / "python"
          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          subprocess.run([python, "-m", "pip", "install", f"{wheel}[api]"], check=True)
          subprocess.run(
              [python, "-c", "import mcp_server; assert len(mcp_server._list_tools()) == 44"],
              cwd="/tmp",
              check=True,
          )
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/swiss-caselaw-scrapers
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
